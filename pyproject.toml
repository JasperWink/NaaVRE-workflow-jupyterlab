[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "NaaVRE_workflow_jupyterlab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "NaaVRE-communicator-jupyterlab>=0.3.0"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

# Real-time collaboration on .naavrewf workflows. Optional: without it the
# extension still works, each user editing their own copy of the file.
# Pinned to the 4.2 line deliberately. It ships the @jupyter/collaboration-
# extension and @jupyter/docprovider-extension 4.3.x labextensions, which is
# what the "@jupyter/collaborative-drive": "~4.3.0" and "@jupyter/docprovider":
# "~4.3.0" singletons in package.json are built against. Those are declared
# singletons, so the versions must line up: a wider range lets pip pull a newer
# jupyter-collaboration whose labextension either fails JupyterLab's
# compatibility check outright or loads against mismatched singletons. Change
# this and the package.json pins together.
[project.optional-dependencies]
collaboration = ["jupyter-collaboration>=4.2,<4.3"]

# The entry-point name MUST equal the document's file type ('naavrewfdoc', see
# src/index.ts): jupyter_server_ydoc resolves the class via YDOCS.get(file_type)
# and would otherwise fall back to the generic YFile.
[project.entry-points.jupyter_ydoc]
naavrewfdoc = "NaaVRE_workflow_jupyterlab.ydoc:YWorkflow"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["NaaVRE_workflow_jupyterlab/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"NaaVRE_workflow_jupyterlab/labextension" = "share/jupyter/labextensions/@naavre/workflow-jupyterlab"
"install.json" = "share/jupyter/labextensions/@naavre/workflow-jupyterlab/install.json"

[tool.hatch.build.hooks.version]
path = "NaaVRE_workflow_jupyterlab/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "NaaVRE_workflow_jupyterlab/labextension/static/style.js",
    "NaaVRE_workflow_jupyterlab/labextension/package.json",
]
skip-if-exists = ["NaaVRE_workflow_jupyterlab/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "NaaVRE_workflow_jupyterlab/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyterlab>=4.0.0,<5'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
